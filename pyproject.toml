[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-msi"
version = "0.1.0rc1"
description = "Budget- and risk-aware industrial model adaptation harness"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "psutil>=5.9,<8",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
